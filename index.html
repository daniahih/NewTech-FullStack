<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Async Fetch Example</title>
  </head>

  <body>
    <script>
      let userData;

      fetch("https://jsonplaceholder.typicode.com/users/1")
        .then((response) => response.json())
        .then((data) => {
          userData = data;

          console.log("Inside fetch:", userData);
        });

      // This runs BEFORE fetch finishes
      console.log("Immediately:", userData);

      /*
      Output will most likely be:

      Immediately: undefined

      Then later:

      Inside fetch: {
        id: 1,
        name: "...",
        ...
      }

      Why?

      fetch() is asynchronous.

      JavaScript does NOT stop here and wait for the response.

      It starts the fetch request,
      continues executing the next lines,
      and only when the response comes back
      does the .then() callback run.

      So this:

      console.log(userData);

      runs before:

      userData = data;

      That is why we get undefined.
    */
    </script>
  </body>
</html>
